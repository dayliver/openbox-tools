[project]
name = "keybinder"
version = "0.1.0"
description = "Archcraft Openbox keyboard shortcut manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.0",
    "textual>=8.2.8",
]

[project.scripts]
keybinder = "keybinder.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
